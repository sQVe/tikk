name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --bun format:check
      - run: bun run --bun style:check
      - run: bun run --bun typecheck
      - run: bun run --bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --bun test

  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The job is advisory and has no mutant cap, so time bounds it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Find the merge base
        id: base
        # Throwaway ME-1017 timing run: mutate only PR #32's src files on today's code.
        run: echo "sha=a328fabc26af930db43aec89074b3ccd67d682b6" >> "${GITHUB_OUTPUT}"
      # The command runner reports the whole suite as one test, so Stryker cannot see a changed test.
      # The key must change with every file that can change a mutant's result.
      - name: Restore the incremental report
        id: incremental
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: mutation-${{ github.event.pull_request.number }}-${{ hashFiles('src/**', 'tests/**', 'scripts/**', 'bun.lock', 'bunfig.toml', 'package.json', 'tsconfig.json', 'vite.config.ts', 'stryker.config.json', '.pi/tau.json') }}-${{ steps.base.outputs.sha }}-${{ github.sha }}
          restore-keys: mutation-${{ github.event.pull_request.number }}-${{ hashFiles('src/**', 'tests/**', 'scripts/**', 'bun.lock', 'bunfig.toml', 'package.json', 'tsconfig.json', 'vite.config.ts', 'stryker.config.json', '.pi/tau.json') }}-${{ steps.base.outputs.sha }}-
      # Incremental mode stays out of stryker.config.json, because local runs have no key that
      # invalidates a result when a test changes.
      - name: Mutate the changed lines
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          config="${RUNNER_TEMP}/stryker.config.json"
          jq '.incremental = true | .incrementalFile = ".tau/stryker-incremental.json"' stryker.config.json > "${config}"
          mapfile -t command < <(jq --raw-output '.mutation.argv[]' .pi/tau.json)
          status=0
          "${command[@]}" changed "${BASE_SHA}" --config "${config}" > mutation.json || status=$?
          cat mutation.json
          exit "$status"
      # The job fails when a mutant survives, and actions/cache saves only after a passing job.
      - name: Save the incremental report
        if: ${{ !cancelled() && steps.incremental.outputs.cache-hit != 'true' && hashFiles('.tau/stryker-incremental.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: ${{ steps.incremental.outputs.cache-primary-key }}
