[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/tikk-cli"]
exclude = ["vendor/gpui-component"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
gpui-kit = "0.9"
ra-ap-rustc_lexer = "0.183"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "std"] }
tikk-core = { path = "crates/tikk-core" }
tikk-ui = { path = "crates/tikk-ui" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
should_panic_without_expect = "warn"
redundant_clone = "warn"
