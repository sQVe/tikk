exclude_globs = [
  # The vendored kit is the published crate, and its tests do not run here.
  "vendor/**",
  # The scene binary opens a window, which unit tests cannot check.
  "crates/tikk-ui/src/bin/**",
  # Scenes are fake data on real parts, and only a capture shows them.
  "crates/tikk-ui/src/scenes/**",
  # The CLI entry point delegates argument parsing and output to clap.
  "crates/tikk-cli/src/main.rs",
  # The desktop entry point is reserved for display-dependent startup.
  "crates/tikk-desktop/**",
  # Integration tests: a mutant in a test only weakens the test itself.
  "**/tests/**",
  # Test helpers: a mutant in a helper only weakens the tests that use it.
  "**/test_support.rs",
  # Test helper modules: a mutant in a helper only weakens the tests that use it.
  "**/test_support/**",
]
test_tool = "nextest"
timeout_multiplier = 3.0
# Empty crates are valid while the workspace is being built out.
additional_cargo_test_args = ["--no-tests=pass"]
